# MODE C — SEPARATE AGENT REACH VPS. Caddy terminates HTTPS; the sidecar is
# reachable only through Caddy on the private network.
#
#   docker compose -f docker-compose.separate-vps.yml up -d --build
#
services:
  caddy:
    image: caddy:2-alpine
    container_name: linkedin-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SIDECAR_DOMAIN: ${SIDECAR_DOMAIN:?set SIDECAR_DOMAIN, e.g. linkedin-api.example.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      linkedin-agent-reach:
        condition: service_healthy
    networks:
      - edge

  linkedin-agent-reach:
    build:
      context: .
      dockerfile: Dockerfile
    image: linkedin-agent-reach:vps
    container_name: linkedin-agent-reach
    restart: unless-stopped
    # No published ports: only Caddy can reach it.
    expose:
      - "8787"
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      MCP_COMMAND: ${MCP_COMMAND:-mcp-server-linkedin}
      MCP_ARGS: ${MCP_ARGS:-}
      MCP_PROFILE_DIR: /data/linkedin-profile
      MCP_REQUEST_TIMEOUT_MS: "60000"
      RATE_LIMIT: "30"
      LINKEDIN_SERVICE_TOKEN: ${LINKEDIN_SERVICE_TOKEN:?set LINKEDIN_SERVICE_TOKEN}
    volumes:
      - linkedin-session:/data
    networks:
      - edge
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.5"

networks:
  edge:
    driver: bridge

volumes:
  linkedin-session:
    name: linkedin-session
  caddy-data:
  caddy-config:
