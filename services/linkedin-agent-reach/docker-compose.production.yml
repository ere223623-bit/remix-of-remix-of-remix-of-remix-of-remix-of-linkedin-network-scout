# MODE B — SAME VPS. App and sidecar share a private Docker network; the
# sidecar is NOT published to the host or the internet.
#
#   docker compose -f docker-compose.production.yml up -d --build
#
services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: linkedin-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      # Internal service discovery — no public exposure of the sidecar.
      LINKEDIN_SERVICE_URL: http://linkedin-agent-reach:8787
      LINKEDIN_SERVICE_TOKEN: ${LINKEDIN_SERVICE_TOKEN:?set LINKEDIN_SERVICE_TOKEN}
      LINKEDIN_SERVICE_TIMEOUT_MS: "45000"
    depends_on:
      linkedin-agent-reach:
        condition: service_healthy
    networks:
      - linkedin-internal
    deploy:
      resources:
        limits:
          memory: 1g

  linkedin-agent-reach:
    build:
      context: .
      dockerfile: Dockerfile
    image: linkedin-agent-reach:production
    container_name: linkedin-agent-reach
    restart: unless-stopped
    # Deliberately no `ports:` — reachable only inside linkedin-internal.
    expose:
      - "8787"
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      MCP_COMMAND: ${MCP_COMMAND:-mcp-server-linkedin}
      MCP_ARGS: ${MCP_ARGS:-}
      MCP_PROFILE_DIR: /data/linkedin-profile
      MCP_REQUEST_TIMEOUT_MS: "60000"
      RATE_LIMIT: "30"
      LINKEDIN_SERVICE_TOKEN: ${LINKEDIN_SERVICE_TOKEN:?set LINKEDIN_SERVICE_TOKEN}
    volumes:
      - linkedin-session:/data
    networks:
      - linkedin-internal
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.5"

networks:
  linkedin-internal:
    driver: bridge
    internal: false

volumes:
  linkedin-session:
    name: linkedin-session
